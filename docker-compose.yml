services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mflint
      POSTGRES_PASSWORD: mflint
      POSTGRES_DB: mflint
    ports:
      - "5432:5432"
    volumes:
      - mflint-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mflint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mflint-postgres-data:
