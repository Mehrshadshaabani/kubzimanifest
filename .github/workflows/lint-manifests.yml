name: Lint Kubernetes manifests

on:
  pull_request:
    paths:
      - 'testdata/manifests/**'
      - '.github/workflows/lint-manifests.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Mehrshadshaabani/kubzimanifest@v1
        with:
          path: ./testdata/manifests
          cloud: aws
